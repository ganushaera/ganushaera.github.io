backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME   # e.g. ganusha411/ganusha.dev
  branch: main                                 # change to "master" if that's your default branch
  base_url: https://YOUR-OAUTH-PROXY.vercel.app  # step 3 walkthrough eken methnata URL ekak ain­wanawa

media_folder: "photos"      # uploaded photos save wenne meke
public_folder: "photos"     # site eke pennana path eka

collections:

  # ---------- BLOG ----------
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blog"        # posts thiyenne me folder eke .md files widiyata
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Cover Photo", name: "cover", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # ---------- REPAIR GALLERY ----------
  - name: "repair_gallery"
    label: "Repair Gallery"
    label_singular: "Repair Photo"
    folder: "content/repair-gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", required: false }

  # ---------- PROJECTS / PORTFOLIO ----------
  - name: "projects"
    label: "Portfolio Projects"
    label_singular: "Project"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Name", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["software", "shopify"] }
      - { label: "Screenshot", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Tech Tags (comma separated)", name: "tags", widget: "string", required: false }
      - { label: "GitHub Link", name: "github_url", widget: "string", required: false }
      - { label: "Live Demo Link", name: "demo_url", widget: "string", required: false }

  # ---------- ABOUT PAGE TEXT ----------
  - name: "about"
    label: "About Page"
    files:
      - file: "content/about.yml"
        label: "About Content"
        name: "about"
        fields:
          - { label: "Intro Paragraph 1", name: "para1", widget: "text" }
          - { label: "Intro Paragraph 2", name: "para2", widget: "text" }
          - { label: "Intro Paragraph 3", name: "para3", widget: "text" }
